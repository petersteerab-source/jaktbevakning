name: Vakthund

# Dödmansgrepp. Larmar om jaktbevakningen har tystnat.
# Kollar både Actions-historik och _senast i state.json.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  kontrollera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kolla när bevakningen senast kördes
        env:
          GH_TOKEN: ${{ github.token }}
          GRANS_TIMMAR: '26'
        run: |
          set -euo pipefail

          senaste=$(gh run list --workflow bevaka.yml --limit 1 \
                      --json updatedAt --jq '.[0].updatedAt // empty')

          senast_fil=$(node -e "const fs=require('fs');try{const s=JSON.parse(fs.readFileSync('state.json','utf8'));process.stdout.write(s._senast||'')}catch(e){}")

          if [[ -z "$senaste" && -z "$senast_fil" ]]; then
            echo "Hittade varken körningar eller _senast i state.json."
            timmar=999
            senaste="aldrig"
          else
            nu=$(date -u +%s)
            kandidater=()
            [[ -n "$senaste" ]] && kandidater+=("$(date -u -d "$senaste" +%s)")
            [[ -n "$senast_fil" ]] && kandidater+=("$(date -u -d "$senast_fil" +%s)")
            sen=0
            for t in "${kandidater[@]}"; do
              (( t > sen )) && sen=$t
            done
            timmar=$(( (nu - sen) / 3600 ))
            echo "Senaste körning (Actions): ${senaste:-okänd}"
            echo "Senaste _senast i state:   ${senast_fil:-okänd}"
            echo "Ålder: $timmar timmar."
          fi

          if (( timmar < GRANS_TIMMAR )); then
            echo "✅ Bevakningen lever. Inget larm."
            exit 0
          fi

          echo "⚠️ Ingen körning på $timmar timmar — gränsen är $GRANS_TIMMAR."

          oppna=$(gh issue list --state open --limit 50 \
                    --json title --jq '[.[] | select(.title | startswith("⚠️ Jaktbevakningen"))] | length')

          if (( oppna > 0 )); then
            echo "Ett vakthundslarm ligger redan öppet. Skapar inget nytt."
            exit 0
          fi

          {
            echo "Jaktbevakningen har inte kört på **$timmar timmar**."
            echo ""
            echo "Senaste Actions-körning: ${senaste:-okänd}"
            echo "Senaste _senast i state.json: ${senast_fil:-okänd}"
            echo ""
            echo "Det betyder att inga jaktplatser kontrolleras just nu. Tystnad från"
            echo "bevakningen betyder alltså INTE att allt är fullbokat — den kollar inte alls."
            echo ""
            echo "Vanligaste orsakerna:"
            echo ""
            echo "1. GitHub har pausat schemalagda workflows (60 dagars inaktivitet)."
            echo "   Åtgärd: Actions → Enable workflow."
            echo "2. GitHub har strypt schemaläggningen."
            echo "   Åtgärd: Run workflow manuellt."
            echo "3. Något i koden har gått sönder."
            echo "   Åtgärd: titta på senaste körningen under Actions."
            echo ""
            echo "Stäng den här issuen när bevakningen går igen — annars larmar vakthunden inte på nytt."
          } > vakthund.md

          gh issue create \
            --title "⚠️ Jaktbevakningen har tystnat ($timmar timmar)" \
            --body-file vakthund.md
