name: Bevaka jaktplatser

# GitHub hoppar över täta cron-starter (best effort). Få långa jobb som loopar
# internt ger fler faktiska kontroller. Utan Playwright tar varje varv sekunder,
# så intervallet kan vara tätt utan att äta minuter.

on:
  schedule:
    # 05, 09, 13, 17 UTC = 07, 11, 15, 19 svensk sommartid (06, 10, 14, 18 vintertid).
    - cron: '0 5,9,13,17 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: bevaka
  cancel-in-progress: false

jobs:
  kolla:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bevaka i 4,5 timme
        env:
          LOOP_MINUTER: '270'
          INTERVALL_MIN: '10'
          SLUT_TIMME: '23'
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        run: node kolla.mjs

      - name: Spara state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "jaktbevakning"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          else
            echo "Ingen förändring i state.json."
          fi
