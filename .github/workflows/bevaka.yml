name: Bevaka jaktplatser

# GitHub hoppar över täta cron-starter (best effort). Få långa jobb som loopar
# internt ger fler faktiska kontroller. Varje varv går mot EduAdmins JSON-API
# och tar sekunder.
#
# Playwright installeras ändå — inte för normaldrift, utan som reserv när API:t
# fallerar. Installationen sker en gång per körning (~20 s) och delas av alla
# 27 varv, så kostnaden är försumbar mot att stå blind om endpointen ändras.

on:
  schedule:
    # 05, 09, 13, 17 UTC = 07, 11, 15, 19 svensk sommartid (06, 10, 14, 18 vintertid).
    - cron: '0 5,9,13,17 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: bevaka
  cancel-in-progress: false

jobs:
  kolla:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cachea Playwright-webbläsaren
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.48.0

      - name: Installera reservberoenden
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Bevaka i 4,5 timme
        env:
          LOOP_MINUTER: '270'
          INTERVALL_MIN: '10'
          SLUT_TIMME: '23'
          MISSAR_INNAN_LARM: '3'
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        run: node kolla.mjs

      - name: Spara state
        if: always()
        # Körningens state.json ska alltid vinna. Pull-rebase med lokal commit gav
        # merge-konflikt så fort main ändrats under passet (t.ex. egna commits).
        # Därför: lägg undan filen, hämta färsk main, lägg tillbaka, committa, pusha.
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "jaktbevakning"
            git config user.email "actions@github.com"
            cp state.json /tmp/state.json
            git checkout -- state.json
            git pull --rebase
            cp /tmp/state.json state.json
            if git diff --quiet state.json; then
              echo "state.json redan uppdaterad på main."
              exit 0
            fi
            git add state.json
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git push && break
              echo "Push misslyckades (försök $i), hämtar igen."
              git pull --rebase -X theirs
            done
          else
            echo "Ingen förändring i state.json."
          fi
