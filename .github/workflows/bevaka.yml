name: Bevaka jaktplatser

# GitHub hoppar över de flesta täta schemalagda starterna (best effort, ingen garanti).
# Därför få starter som var och en LOOPAR internt i 4,5 timme och kollar var 10:e minut.
# Fyra starter täcker 07–23 svensk tid även om någon av dem uteblir.

on:
  schedule:
    # 05, 09, 13, 17 UTC = 07, 11, 15, 19 svensk sommartid (06, 10, 14, 18 vintertid).
    - cron: '0 5,9,13,17 * * *'
  workflow_dispatch:

permissions:
  contents: write           # för att spara state.json
  issues: write             # för att skapa larm-issue

concurrency:
  group: bevaka
  cancel-in-progress: false

jobs:
  kolla:
    runs-on: ubuntu-latest
    timeout-minutes: 300     # säkerhetsspärr; loopen slutar av sig själv efter 270 min
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cachea Playwright-webbläsaren
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.48.0

      - name: Installera beroenden
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Bevaka i 4,5 timme
        env:
          LOOP_MINUTER: '270'    # 4,5 timme
          INTERVALL_MIN: '10'    # kontroll var tionde minut
          SLUT_TIMME: '23'       # sluta när klockan passerat 23 svensk tid
          GH_TOKEN: ${{ github.token }}
        run: node kolla.mjs

      - name: Spara state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "jaktbevakning"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          else
            echo "Ingen förändring i state.json."
          fi
