name: Bevaka jaktplatser

# GitHub hoppar över de flesta täta schemalagda starterna (best effort, ingen garanti).
# Därför få starter som var och en LOOPAR internt i 5,5 timme och kollar var 10:e minut.
# Extra tidiga starter är överbokning med flit: de flesta uteblir, och de som
# krockar med ett pågående pass köar i stället för att köra parallellt.

on:
  schedule:
    # UTC. Svensk sommartid = +2, vintertid = +1.
    # 04–07 UTC är fyra försök att få igång ETT morgonpass — 05:17 har i praktiken
    # aldrig gått igång på egen hand. Resten täcker dagen.
    # Udda minut med flit: GitHub köar flest jobb vid minut 0 och kastar överskottet.
    - cron: '17 4,5,6,7,9,13,17 * * *'
  workflow_dispatch:

permissions:
  contents: write           # för att spara state.json
  issues: write             # för att skapa larm-issue

concurrency:
  group: bevaka
  cancel-in-progress: false

jobs:
  kolla:
    runs-on: ubuntu-latest
    timeout-minutes: 360     # säkerhetsspärr; loopen slutar av sig själv efter 330 min
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cachea Playwright-webbläsaren
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.48.0

      - name: Installera beroenden
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Bevaka i 5,5 timme
        env:
          LOOP_MINUTER: '330'    # 5,5 timme
          INTERVALL_MIN: '10'    # kontroll var tionde minut
          SLUT_TIMME: '23'       # sluta när klockan passerat 23 svensk tid
          MISSAR_INNAN_LARM: '3' # larma när avläsningen fallerat 3 varv i rad
          GH_TOKEN: ${{ github.token }}
        run: node kolla.mjs

      - name: Spara state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "jaktbevakning"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          else
            echo "Ingen förändring i state.json."
          fi
